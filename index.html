<!doctype html><html lang="th">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CRUD V2.1</title><link rel="stylesheet" href="styles.css">
  </head>
  <body><main><h1>ระบบข้อมูล</h1>
    <form id="f"><input type="hidden" id="row">
      <input type="hidden" id="old"><label>ID 
        <input id="id" required></label><label>ชื่อ 
          <input id="name" required></label><label>อายุ 
            <input id="age" type="number" min="1" max="120" required></label><label>รูป 
              <input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><small>รูปไม่เกิน 5 MB</small>
      <div id="preview"></div>
      <button>บันทึก</button>
      <button type="button" id="cancel">ยกเลิก</button>
    </form><p id="status"></p>
    <table><thead><tr><th>รูป</th><th>ID</th>
      <th>ชื่อ</th><th>อายุ</th>
      <th>จัดการ</th></tr></thead><tbody id="t"></tbody></table></main>
    <script src="app.js"></script>
  </body>
</html>
